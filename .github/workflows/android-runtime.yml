name: Android 16 Runtime Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-runtime.yml'
      - 'Part 7/app/src/androidTest/**'
concurrency:
  group: android-runtime-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - name: Fetch source
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git sparse-checkout set --cone "Part 7" ".github"
          git checkout --detach FETCH_HEAD
      - name: Configure Java and Android 16 emulator
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name jarvis36 --path "$ANDROID_AVD_HOME/jarvis36.avd" --package "system-images;android-36;google_apis;x86_64"
      - name: Boot emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd jarvis36 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 -no-metrics > /tmp/jarvis-emulator.log 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then tail -100 /tmp/jarvis-emulator.log; exit 1; fi
            if "$ANDROID_HOME/platform-tools/adb" devices | grep -q "emulator.*device$"; then break; fi
            sleep 3
          done
          for attempt in $(seq 1 120); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 5
          done
          tail -100 /tmp/jarvis-emulator.log
          exit 1
      - name: Execute encryption and reported-screen runtime tests
        working-directory: 'Part 7'
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Runtime diagnostics
        if: always()
        run: |
          tail -100 /tmp/jarvis-emulator.log || true
          timeout 20 "$ANDROID_HOME/platform-tools/adb" logcat -d -b crash || true
          find 'Part 7/app/build/outputs/androidTest-results' -name '*.xml' -exec cat {} \; || true
      - name: Home visual evidence from disposable emulator
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          adb = os.path.join(os.environ['ANDROID_HOME'], 'platform-tools', 'adb')
          result = subprocess.run([adb, 'exec-out', 'run-as', 'com.jarvis.assistant', 'cat', 'cache/jarvis-home-preview.jpg'], capture_output=True, timeout=20)
          if result.returncode == 0 and result.stdout.startswith(b'\xff\xd8'):
              print(json.dumps({'jarvis_home_preview_jpeg': base64.b64encode(result.stdout).decode('ascii')}))
          else:
              print('Home visual evidence unavailable; inspect the runtime test result.')
          PY
