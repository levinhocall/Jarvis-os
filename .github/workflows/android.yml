name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# CI only needs to read the repository. Do not grant write permissions to build jobs.
permissions:
  contents: read

# Avoid wasting runners on superseded commits for the same branch or PR.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify JARVIS OS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: "Part 7"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Java and Gradle Environment
        run: |
          java -version
          ./gradlew --version

      - name: Run Unit Tests
        id: unit_tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        id: assemble
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Keep lint visible but non-blocking during the initial baseline phase.
      # It can become a required gate after existing findings are triaged.
      - name: Run Android Lint (baseline / non-blocking)
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            Part 7/app/build/reports/tests/testDebugUnitTest/
            Part 7/app/build/reports/lint-results-debug.html
            Part 7/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-debug-apk
          path: Part 7/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
