name: Android CI

# APK verification was explicitly authorized by the owner on 2026-11-03.
# Workflow edits trigger this delivery; ordinary app-source pushes remain manual.
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify JARVIS OS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: "Part 7"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Environment
        run: ./gradlew --version --no-daemon

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Generate APK Checksum
        working-directory: "Part 7/app/build/outputs/apk/debug"
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload Debug APK
        id: debug-apk
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-debug-${{ github.run_number }}
          path: |
            Part 7/app/build/outputs/apk/debug/app-debug.apk
            Part 7/app/build/outputs/apk/debug/app-debug.apk.sha256
            Part 7/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: Part 7/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            Part 7/app/build/reports/lint-results-debug.html
            Part 7/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

