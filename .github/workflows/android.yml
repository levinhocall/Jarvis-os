name: Android CI

# Automatic CI execution is intentionally disabled.
# Keep the workflow available for an explicitly requested manual run only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify JARVIS OS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "Part 7"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle Environment
        run: ./gradlew --version --no-daemon
      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
